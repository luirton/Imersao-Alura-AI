<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Web - Desafio 2</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="calculator-container">
    <div class="calculator">
      <header class="calculator-header">
        <span class="badge">Desafio 2</span>
        <h1>Calculadora Web</h1>
      </header>

      <div class="display-container">
        <div class="previous-operand" id="previous-operand"></div>
        <div class="current-operand" id="current-operand">0</div>
      </div>

      <div class="keypad">
        <button type="button" class="btn btn-function" data-action="clear">AC</button>
        <button type="button" class="btn btn-function" data-action="delete">DEL</button>
        <button type="button" class="btn btn-function" data-action="percent">%</button>
        <button type="button" class="btn btn-operator" data-action="operator" data-value="÷">÷</button>

        <button type="button" class="btn btn-number" data-value="7">7</button>
        <button type="button" class="btn btn-number" data-value="8">8</button>
        <button type="button" class="btn btn-number" data-value="9">9</button>
        <button type="button" class="btn btn-operator" data-action="operator" data-value="×">×</button>

        <button type="button" class="btn btn-number" data-value="4">4</button>
        <button type="button" class="btn btn-number" data-value="5">5</button>
        <button type="button" class="btn btn-number" data-value="6">6</button>
        <button type="button" class="btn btn-operator" data-action="operator" data-value="-">−</button>

        <button type="button" class="btn btn-number" data-value="1">1</button>
        <button type="button" class="btn btn-number" data-value="2">2</button>
        <button type="button" class="btn btn-number" data-value="3">3</button>
        <button type="button" class="btn btn-operator" data-action="operator" data-value="+">+</button>

        <button type="button" class="btn btn-function" data-action="toggle-sign">±</button>
        <button type="button" class="btn btn-number" data-value="0">0</button>
        <button type="button" class="btn btn-number" data-value=".">.</button>
        <button type="button" class="btn btn-equals" data-action="equals">=</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
